<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background coordinate grid (12 x 12 squares) -->
    <pattern id="grid-pattern" width="42.666" height="42.666" patternUnits="userSpaceOnUse">
      <path d="M 42.666 0 L 0 0 0 42.666" fill="none" stroke="#262832" stroke-width="1.3" />
    </pattern>

    <!-- Precise Antigravity Gaussian Wave Curve -->
    <path id="agy-path" d="
      M 256, 126
      C 288, 126 313, 148 327, 185
      C 342, 226 352, 276 364, 326
      C 374, 368 388, 400 401, 415
      C 406, 421 406, 426 401, 429
      C 395, 432 386, 430 376, 420
      C 360, 404 345, 374 332, 338
      C 316, 298 296, 276 276, 268
      C 265, 264 256, 264 246, 268
      C 226, 276 206, 298 190, 338
      C 177, 374 162, 404 146, 420
      C 136, 430 127, 432 121, 429
      C 116, 426 116, 421 121, 415
      C 134, 400 148, 368 158, 326
      C 170, 276 180, 226 195, 185
      C 209, 148 234, 126 256, 126
      Z
    " />

    <clipPath id="curve-clip">
      <use href="#agy-path" />
    </clipPath>

    <!-- Base Electric Blue to Royal Blue Linear Gradient -->
    <linearGradient id="blueBase" x1="256" y1="180" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#3b82f6" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Vibrant Lime / Emerald Green Flare on Left Slope -->
    <radialGradient id="greenFlare" cx="205" cy="195" r="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="1" />
      <stop offset="35%" stop-color="#22c55e" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#16a34a" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#15803d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0" />
    </radialGradient>

    <!-- Fiery Coral / Vermilion / Orange Flare on Upper Right & Apex -->
    <radialGradient id="orangeFlare" cx="288" cy="155" r="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7a38" stop-opacity="1" />
      <stop offset="35%" stop-color="#f95738" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#ea381e" stop-opacity="0.7" />
      <stop offset="85%" stop-color="#dc2626" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>

    <!-- Luminous Central Cyan Glow for the Arch Belly -->
    <radialGradient id="bellyCyan" cx="256" cy="275" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Square Container with subtle rounding (matches Windows Desktop Tile Icon) -->
  <rect x="8" y="8" width="496" height="496" rx="28" fill="#131417" stroke="#2a2d36" stroke-width="2" />

  <!-- Background Grid overlay -->
  <g clip-path="url(#container-clip)">
    <clipPath id="container-clip">
      <rect x="8" y="8" width="496" height="496" rx="28" />
    </clipPath>
    <rect x="8" y="8" width="496" height="496" fill="url(#grid-pattern)" />
  </g>

  <!-- Antigravity Wave Curve with Layered Mesh Gradient -->
  <g clip-path="url(#curve-clip)">
    <!-- 1. Full Body Electric Blue Gradient -->
    <rect x="80" y="100" width="352" height="340" fill="url(#blueBase)" />

    <!-- 2. Arch Belly Cyan Radiance -->
    <rect x="80" y="100" width="352" height="340" fill="url(#bellyCyan)" />

    <!-- 3. Vibrant Green Flare on Left Flank -->
    <rect x="80" y="100" width="352" height="340" fill="url(#greenFlare)" />

    <!-- 4. Fiery Orange/Red Flare on Peak & Right Flank -->
    <rect x="80" y="100" width="352" height="340" fill="url(#orangeFlare)" />
  </g>
</svg>
