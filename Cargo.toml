[package]
name = "antigravity-historical-dialogue"
version = "0.1.0"
edition = "2024"

[lib]
name = "antigravity_historical_dialogue"
path = "src/lib.rs"

[[bin]]
name = "antigravity-historical-dialogue"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winres = "0.1"

[lints.rust]

warnings = "deny"

unsafe_code = "forbid"

[lints.clippy]

all = { level = "deny", priority = -1 }

style = "deny"
complexity = "deny"
perf = "deny"
correctness = "deny"
suspicious = "deny"
